[package]
name = "halal-crawler"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "cookies"] }
scraper = "0.22"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
dotenvy = "0.15"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }

[dev-dependencies]
httpmock = "0.7"
